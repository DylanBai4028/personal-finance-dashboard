# Same shape as category_rules.local.yaml, with generic patterns instead of
# Dylan's real merchant history. Committed, and used to categorize
# src/lib/demo_data_generator.py's synthetic transactions for the public demo
# — proving the categorization pipeline works, not just the dashboard.

rules:
  - pattern: "CREDIT INTEREST PAID"
    account: "Income:Interest"
    source: manual

  - pattern: "BONUS CREDIT INTEREST PAID"
    account: "Income:Interest"
    source: manual

  - pattern: "SALARY"
    account: "Income:Salary"
    source: manual

  - pattern: "COLES"
    account: "Expenses:Food:Groceries"
    source: manual

  - pattern: "WOOLWORTHS"
    account: "Expenses:Food:Groceries"
    source: manual

  - pattern: "UBER EATS"
    account: "Expenses:Food:Dining"
    source: manual

  - pattern: "TRANSPORTFORNSW"
    account: "Expenses:Transport"
    source: manual

  - pattern: "RENT"
    account: "Expenses:Housing:Rent"
    source: manual
